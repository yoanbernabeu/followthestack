summary: "Gave $25 million to MAGA Inc., the super PAC supporting President Donald Trump, according to the super PAC's filing with the Federal Election Commission covering 1 July to 22 December 2025, as reported by Reuters. Brockman's gift was one of the three largest sources of the roughly $102 million MAGA Inc. raised over that period. Brockman is co-founder and president of OpenAI."
status: established
response: "The Decoder reported on 3 January 2026 that Brockman had not commented on his support for Trump."
