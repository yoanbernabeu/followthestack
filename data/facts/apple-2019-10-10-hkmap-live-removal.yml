subject: apple
grievances: [authoritarian-alignment]
date: "2019-10-10"
summary: "Removed HKmap.live, a crowdsourced map of police positions used during the Hong Kong anti-government protests, from the App Store, a day after the Chinese Communist Party newspaper People's Daily attacked Apple over the app."
status: established
response: "Apple said the app \"has been used to target and ambush police\" and \"threaten public safety\". Tim Cook told employees Apple had received \"credible information\" that it was being \"used maliciously\". The app's developers said there was \"0 evidence\" to support the accusation that the app had been used to target and ambush police."
