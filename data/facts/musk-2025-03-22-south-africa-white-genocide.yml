summary: "Posted on X over the weekend of 22–23 March 2025 that a major South African political party is \"actively promoting white genocide\", linking to a video of an Economic Freedom Fighters rally where the song \"Kill the Boer\" was sung. Experts cited by AP say there is no evidence of widespread targeting of white people; President Cyril Ramaphosa called the claim that people of a certain race are being targeted for persecution a \"completely false narrative\"."
