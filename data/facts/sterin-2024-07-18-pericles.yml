summary: "L'Humanité revealed the \"Périclès\" plan backed by Stérin: about €150 million over ten years, naming \"socialism, wokism, Islamism, immigration\" as enemies, aiming to help the Rassemblement National win 300 towns in 2026 and to build a reserve of 1,000 people for government posts ahead of 2027, and claiming a \"relationship of trust\" with Jordan Bardella and Marine Le Pen."
