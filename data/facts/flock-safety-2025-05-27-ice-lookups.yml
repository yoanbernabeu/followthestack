date: "2025-05-27"
summary: "Search logs obtained through a public records request showed more than 4,000 lookups in Flock's nationwide automatic license plate reader network by local and state police done at the behest of federal law enforcement, as an \"informal\" favor to it, or with a potential immigration focus, with reasons such as \"immigration\", \"ICE\" and \"ICE+ERO\", giving federal law enforcement side-door access to a tool for which Flock had no formal contract with ICE."
