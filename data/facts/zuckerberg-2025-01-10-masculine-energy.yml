subject: mark-zuckerberg
grievances: [sexism]
date: "2025-01-10"
summary: "On the Joe Rogan Experience, released the day Meta said it was halting many of its diversity-focused training and hiring efforts, lamented \"culturally neutered\" companies that had sought to distance themselves from \"masculine energy\" and said it is good if a culture \"celebrates the aggression a bit more\"."
quote:
  text: "Masculine energy I think is good, and obviously society has plenty of that, but I think that corporate culture was really trying to get away from it"
  lang: en
status: established
response: "In the same conversation he said \"you want feminine energy, you want masculine energy\", that \"that's all good\", and that \"you want women to be able to succeed\" in companies."
