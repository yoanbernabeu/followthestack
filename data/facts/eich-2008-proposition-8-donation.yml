subject: brendan-eich
grievances: [lgbtphobia]
date: "2008-01-01"
datePrecision: year
summary: "Donated $1,000 in support of California Proposition 8, the 2008 ballot measure banning same-sex marriage. The donation became public in 2012 and led to his resignation as Mozilla CEO in April 2014, less than two weeks after his appointment was announced."
status: established
response: "In 2012 Eich confirmed the donation, said Mozilla had nothing to do with it and declined to discuss Proposition 8. He stepped down as Mozilla CEO and from the Mozilla Foundation board on April 3, 2014."
