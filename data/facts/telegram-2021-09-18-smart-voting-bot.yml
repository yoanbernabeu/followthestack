subject: telegram
grievances: [authoritarian-alignment]
date: "2021-09-18"
summary: "During Russia's State Duma election, restricted bots associated with election campaigning, citing Russia's \"election silence\" rule, which disabled the Smart Voting bot of jailed opposition leader Alexei Navalny's team. Apple and Google had removed the Smart Voting app from their Russian stores the day before; Russian authorities had labelled Navalny's network extremist."
quote:
  text: "Мы считаем эту практику легитимной и призываем пользователей Telegram уважать ее."
  lang: ru
status: established
response: "Pavel Durov said Telegram was following the precedent set by Apple and Google, which \"dictate the rules of the game to developers like us\", and warned their removal set a dangerous precedent for free speech."
