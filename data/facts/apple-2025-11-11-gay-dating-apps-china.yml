summary: "Confirmed it had removed Blued and Finka, two of China's most popular gay dating apps, from its Chinese App Store on the order of the Cyberspace Administration of China."
status: established
response: "Apple said the removal was \"based on an order from the Cyberspace Administration of China\" and that it must follow the laws of the countries where it operates."
