subject: peter-thiel
grievances: [sexism, anti-democracy]
date: "2009-04-13"
summary: "In the essay \"The Education of a Libertarian\", cited the extension of the vote to women, together with the growth of welfare beneficiaries, as having turned \"capitalist democracy\" into an oxymoron."
quote:
  text: 'Since 1920, the vast increase in welfare beneficiaries and the extension of the franchise to women — two constituencies that are notoriously tough for libertarians — have rendered the notion of "capitalist democracy" into an oxymoron.'
  lang: en
status: established
response: "In a later clarification appended to the essay, Thiel wrote: \"It would be absurd to suggest that women's votes will be taken away or that this would solve the political problems that vex us. While I don't think any class of people should be disenfranchised, I have little hope that voting will make things better.\""
sources:
  - url: https://www.cato-unbound.org/2009/04/13/peter-thiel/education-libertarian/
    outlet: "Cato Unbound (primary source)"
    date: "2009-04-13"
