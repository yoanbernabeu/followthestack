subject: meta
grievances: [lgbtphobia]
date: "2025-01-10"
summary: "Deleted the trans and nonbinary chat themes from Messenger, introduced in 2021 and 2022, in the same week it changed its hateful conduct rules to allow allegations that LGBTQ+ people are mentally ill. The blog posts announcing the themes were also no longer online."
status: established
response: "Meta did not respond to 404 Media's request for comment and declined to comment to Platformer."
