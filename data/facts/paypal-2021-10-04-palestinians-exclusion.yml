subject: paypal
grievances: [racism]
date: "2021-10-04"
summary: "Does not offer its services to Palestinians in the occupied West Bank and Gaza, while serving all Israeli citizens, including those living in Israeli settlements in the West Bank. On 4 October 2021, some 55 Palestinian, Arab and international groups, including al-Haq, sent an open letter to CEO Dan Schulman asking PayPal to end what they described as discriminatory practices. The digital rights group 7amleh, which leads the #PayPal4Palestine campaign, says the policy \"appears to be based on discriminatory grounds of national or ethnic origin rather than location\". In May 2023, eleven members of the US Congress wrote to PayPal that it had a responsibility to provide its services \"in a non-discriminatory manner\"."
status: contested
response: "PayPal has said the Palestinian territories are a \"high risk\" environment. In 2016 it said: \"We hope ultimately to be able to address the risk, compliance, regulatory and resource allocation issues\". It did not respond to Al Jazeera or The New Arab in October 2021."
