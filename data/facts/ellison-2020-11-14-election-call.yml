subject: larry-ellison
grievances: [anti-democracy]
date: "2020-11-14"
summary: "Took part in a 14 November 2020 phone call focused on strategies for contesting Donald Trump's 2020 election defeat, alongside Senator Lindsey Graham, Fox News host Sean Hannity and Trump lawyer Jay Sekulow, according to an email from True the Vote founder Catherine Engelbrecht revealed in May 2022 in a court filing by Fair Fight in its lawsuit against True the Vote, first reported by The Washington Post. The email said the participants asked for a preliminary report \"to be used to rally their troops internally\"."
status: contested
response: "The account rests on a single email written by a third party; Ellison has not commented on the call. An Oracle spokeswoman did not immediately respond to Reuters' request for comment."
