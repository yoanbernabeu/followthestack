subject: apple
grievances: [surveillance-deportation, authoritarian-alignment]
date: "2025-10-02"
summary: "Removed ICEBlock, an app for reporting the presence of Immigration and Customs Enforcement (ICE) agents, and similar apps from the App Store after the US Attorney General Pam Bondi said the Justice Department had demanded it."
status: established
response: "Apple said it removed the app \"based on information we've received from law enforcement about the safety risks associated with ICEBlock\". The app's creator, Joshua Aaron, said he was \"incredibly disappointed by Apple's actions\"."
