date: "2024-03-25"
summary: "A federal judge dismissed X Corp.'s lawsuit against the Center for Countering Digital Hate, a nonprofit whose reports documented rising hate speech on X and which X blamed for lost advertising. Judge Charles Breyer wrote that the suit was \"unabashedly and vociferously about one thing\": punishing the nonprofit for its speech."
status: established
response: "X said it \"disagrees with the court's decision and plans to appeal\"."
