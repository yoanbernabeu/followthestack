subject: rumble
grievances: [anti-democracy]
date: "2025-02-21"
summary: "Did not comply with orders from Brazilian Supreme Court Justice Alexandre de Moraes to name a legal representative in Brazil within 48 hours and to block the account of Allan dos Santos, a pro-Bolsonaro influencer living in the United States who is considered a fugitive in Brazil. CEO Chris Pavlovski said publicly he would not comply with the orders and wrote to Moraes in Portuguese \"Nos veremos no tribunal\" (\"See you in court\"). Moraes ordered Rumble suspended in Brazil on 21 February 2025 until it complies. Rumble and Trump Media & Technology Group had sued Moraes in a US federal court in Tampa days earlier, accusing him of illegal censorship."
quote:
  text: "Nos veremos no tribunal."
  lang: pt
status: established
response: "Rumble and Trump Media said Moraes's orders \"violate American sovereignty, the U.S. Constitution, and U.S. laws\" and called them censorship; Moraes wrote that Pavlovski deliberately confused censorship with the constitutional ban on hate speech."
