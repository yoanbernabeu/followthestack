subject: clearview-ai
grievances: [surveillance-deportation]
date: "2025-09-05"
summary: "Was awarded an ICE Homeland Security Investigations contract for facial recognition software, with an initial $3,750,000 purchase on September 5, 2025 and a total value of up to $9,225,000. Procurement records state it supports identifying victims and offenders in child sexual exploitation cases and in \"assaults against law enforcement officers\". The contract began days before ICE launched its \"Midway Blitz\" immigration enforcement operation in the Chicago area."
status: established
