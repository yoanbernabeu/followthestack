subject: xavier-niel
grievances: [press-justice-attacks]
date: "2008-11-28"
summary: "On November 28, 2008, Vittorio de Filippis, former publication director of the French daily Libération, was arrested at his home at about 6:40 a.m. on a warrant from a Paris investigating judge, searched, and brought before the judge, who placed him under formal investigation for public defamation of a private individual. The case stemmed from a defamation complaint filed by Xavier Niel, founder of Free, over content published on Libération's website in 2006 about his conviction that year: Le Monde Informatique and Index on Censorship identify it as a reader's comment, while Reporters Without Borders refers to articles by journalist Renaud Lecadre. Niel and Free had filed several other defamation complaints against Libération over its coverage. According to Le Monde Informatique, citing Libération, they lost the cases tried in 2008 and were ordered to pay the newspaper damages for abusive proceedings; Index on Censorship wrote that Niel had already brought and lost four lawsuits against the newspaper. In May 2009, Univers Freebox reported that the appeal court upheld the acquittals and ordered Free to pay 6,000 euros in damages for abusive complaints. Reporters Without Borders condemned the methods used against de Filippis."
