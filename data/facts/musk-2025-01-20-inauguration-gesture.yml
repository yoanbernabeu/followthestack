subject: elon-musk
grievances: [far-right-support]
date: "2025-01-20"
summary: "At a Trump inauguration event at Capital One Arena in Washington, thumped his right hand over his heart and then extended his right arm upward, palm down, toward the crowd, and repeated the gesture toward the crowd behind him, before saying \"My heart goes out to you\". The gesture was widely compared to a Nazi salute; its meaning is disputed."
status: contested
response: "Musk did not explicitly address the gesture's intent; he wrote on X \"Frankly, they need better dirty tricks. The 'everyone is Hitler' attack is sooo tired.\" He replied \"Thanks guys\" to the ADL, which had written \"It seems that Elon Musk made an awkward gesture in a moment of enthusiasm, not a Nazi salute\"."
