subject: joe-lonsdale
grievances: [violent-rhetoric]
date: "2025-12-05"
summary: "Wrote on X that if he were \"in charge later\", men convicted of three violent crimes would be quickly tried and hanged in public to deter others, adding that it was \"time to bring back masculine leadership to protect our most vulnerable\"."
quote:
  text: "We will quickly try and hang men after three violent crimes. And yes, we will do it in public to deter others."
  lang: en
status: established
response: "Lonsdale defended his position against critics, describing himself as a \"moderate\" who believes \"in second chances\" and saying he would support due process before any public execution."
