subject: jeff-bezos
grievances: [press-justice-attacks]
date: "2025-02-26"
summary: "As owner of The Washington Post, announced that its opinion section would write every day in defense of \"personal liberties and free markets\" and leave opposing viewpoints to other publications. Opinions editor David Shipley resigned rather than oversee the change."
quote:
  text: "We are going to be writing every day in support and defense of two pillars: personal liberties and free markets. We'll cover other topics too of course, but viewpoints opposing those pillars will be left to be published by others."
  lang: en
status: established
