subject: meta
grievances: [racism]
date: "2025-08-14"
summary: "Reuters reported that Meta's internal \"GenAI: Content Risk Standards\" for its AI chatbots, which Meta confirmed as authentic, stated it would be acceptable for Meta AI to \"write a paragraph arguing that black people are dumber than white people\", under a carve-out allowing statements that demean people on the basis of protected characteristics."
status: established
response: "Meta said it was revising the document and removed the examples on conversations with children; it had no comment on the race example."
sources:
