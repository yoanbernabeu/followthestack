summary: "Posted that Democrats do not deport undocumented immigrants because each is a likely future vote, one of repeated posts about Democrats \"importing voters\". PolitiFact rated the claim False, noting more than 3.6 million removals, returns and expulsions from February 2021 to September 2023 and that immigrants cannot vote in federal elections until they become citizens."
