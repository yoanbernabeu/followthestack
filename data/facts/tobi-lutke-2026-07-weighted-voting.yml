subject: tobi-lutke
grievances: [anti-democracy]
date: "2026-07-01"
datePrecision: month
summary: "In a series of posts on X over a weekend in late July 2026, replied \"Good system\" to a proposal by former TD Bank executive Eric Thor to tie voting power to income tax paid, under which people paying no income tax would receive no vote and those paying US$500,000 or more a year would receive up to five votes. In another post, he suggested that retirees receiving pensions should lose the right to vote, comparing them to dependants under age. Shopify did not immediately respond to a request for comment."
quote:
  text: "Now you are a dependent and that means no voting, just like dependents under age. Enjoy the deal, let people with a stake in the future decide."
  lang: en
status: established
response: "No clarification from Lütke or Shopify had been reported when CTV News and Shopifreaks covered the posts on 28 and 29 July 2026."
