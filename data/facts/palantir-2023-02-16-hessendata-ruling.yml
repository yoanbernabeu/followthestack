subject: palantir
grievances: [surveillance-deportation]
date: "2023-02-16"
summary: "Germany's Federal Constitutional Court ruled unconstitutional the Hesse and Hamburg police laws authorising automated data analysis. In Hesse the analysis platform was Palantir's Gotham software, used by police under the name \"HessenDATA\"."
status: established
