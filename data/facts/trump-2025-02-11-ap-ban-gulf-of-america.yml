subject: donald-trump
grievances: [press-justice-attacks]
date: "2025-02-11"
summary: "His White House barred Associated Press reporters from presidential events, then indefinitely from the Oval Office and Air Force One, because the agency kept using the name \"Gulf of Mexico\" rather than the \"Gulf of America\" designation Trump had ordered. AP photographers were still allowed to attend."
status: established
response: "Deputy chief of staff Taylor Budowich said the AP's choice exposed its \"commitment to misinformation\" and that the First Amendment does not ensure their \"privilege of unfettered access to limited spaces, like the Oval Office and Air Force One\"."
