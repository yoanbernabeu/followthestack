summary: "Replied \"Necessary\" to Rep. Brandon Gill's plan to file articles of impeachment against Judge James Boasberg, who had halted deportations under the Alien Enemies Act. Days later, according to people with knowledge of the matter cited by the Boston Globe, he gave the maximum allowed donation to Gill and six other Republican members of Congress who had endorsed judicial impeachments or called for \"action\" in response to rulings against the Trump administration. Chief Justice John Roberts said impeachment \"is not an appropriate response to disagreement concerning a judicial decision\"."
