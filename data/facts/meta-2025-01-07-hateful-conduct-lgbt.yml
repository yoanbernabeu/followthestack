date: 2025-01-07
summary: "Updated its Hateful Conduct policy for Facebook, Instagram and Threads to explicitly allow allegations of mental illness or abnormality based on gender or sexual orientation, while such insults remain prohibited for other protected characteristics."
quote:
  text: "We do allow allegations of mental illness or abnormality when based on gender or sexual orientation, given political and religious discourse about transgenderism and homosexuality"
