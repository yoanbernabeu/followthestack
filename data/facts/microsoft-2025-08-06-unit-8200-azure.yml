subject: microsoft
grievances: [surveillance-deportation]
date: "2025-08-06"
summary: "A joint investigation by The Guardian, +972 Magazine and Local Call reported that Israel's military intelligence Unit 8200 stored recordings of millions of intercepted phone calls of Palestinians in Gaza and the West Bank on Microsoft's Azure cloud, with Microsoft engineers working with the unit on the infrastructure. In September 2025 Microsoft said its review had found \"evidence that supports elements\" of the reporting and disabled the services concerned."
status: established
response: "Microsoft initially said it had \"no information\" about the data stored and was not aware of surveillance of civilians. Brad Smith later wrote: \"We do not provide technology to facilitate mass surveillance of civilians.\""
