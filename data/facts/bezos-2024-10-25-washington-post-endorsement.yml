subject: jeff-bezos
grievances: [press-justice-attacks]
date: "2024-10-25"
summary: "Blocked The Washington Post, which he owns, from publishing an endorsement of Kamala Harris that the editorial board had drafted, less than two weeks before the 2024 presidential election. The paper announced it would no longer endorse presidential candidates; more than 200,000 subscriptions were cancelled and editorial board members resigned."
status: established
response: "In an opinion piece in the Post, Bezos said ending endorsements was meant to avoid a \"perception of bias\", wrote \"No quid pro quo of any kind is at work here\", and acknowledged the timing was \"inadequate planning, and not some intentional strategy\"."
