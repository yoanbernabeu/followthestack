subject: palantir
grievances: [surveillance-deportation]
date: "2025-05-30"
summary: "The New York Times reported that the Trump administration had turned to Palantir to put in place the technical building blocks for sharing data on Americans across federal agencies, following a March 2025 executive order, with its Foundry software deployed in at least four federal agencies, including the Department of Homeland Security and the Department of Health and Human Services. Ten Democratic lawmakers wrote to Palantir calling a possible searchable \"mega-database\" a \"surveillance nightmare\"."
status: contested
response: "Palantir denied many of the claims in a May 30 blog post, saying it does not have the ability to \"proactively share data across federal government sources\", and in a June 17 response to the lawmakers stated that \"Palantir is not building a master database, and Palantir is neither conducting nor enabling mass surveillance of American citizens.\""
sources:
