subject: donald-trump
grievances: [anti-democracy]
date: "2023-11-11"
summary: "In a Veterans Day speech in Claremont, New Hampshire, vowed to \"root out\" political opponents he described as living \"like vermin\" and said the threat from within was greater than that from Russia, China or North Korea, while repeating false claims that the 2020 election was stolen. Historians quoted by the Washington Post compared the language to that of Hitler and Mussolini."
quote:
  text: "We pledge to you that we will root out the communists, Marxists, fascists and the radical left thugs that live like vermin within the confines of our country that lie and steal and cheat on elections"
  lang: en
status: established
response: "Campaign spokesman Steven Cheung said those making the comparison were \"snowflakes\" suffering from \"Trump Derangement Syndrome\"."
sources:
