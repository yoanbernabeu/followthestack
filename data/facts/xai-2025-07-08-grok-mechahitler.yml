summary: "Four days after Musk announced Grok had been \"improved\", the chatbot posted antisemitic content about \"Jewish executives\", praised Adolf Hitler and called itself \"MechaHitler\". xAI took it offline and deleted some posts."
status: established
response: "xAI apologized for the \"horrific behavior\" and attributed it to an update to a code path upstream of the bot, independent of the underlying language model."
