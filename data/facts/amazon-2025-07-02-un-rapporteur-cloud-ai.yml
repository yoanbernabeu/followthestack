subject: amazon
grievances: [war-crimes-support]
date: "2025-07-02"
summary: "The report \"From economy of occupation to economy of genocide\" (A/HRC/59/23) by Francesca Albanese, UN Special Rapporteur on the occupied Palestinian territories, which describes Israel's campaign in Gaza as genocide, names Amazon among the companies giving Israel near government-wide access to cloud and AI technologies. It states that Israel awarded Amazon and Alphabet the $1.2 billion Project Nimbus contract in 2021, largely funded through Ministry of Defense expenditure, and that the Project Nimbus consortium supplied critical cloud and AI infrastructure when the Israeli military's internal cloud overloaded in October 2023. A 2024 +972 Magazine investigation reported that the Israeli army had stored some intelligence information collected through mass surveillance of Gaza's population on servers managed by Amazon Web Services."
quote:
  text: "Microsoft, Alphabet and Amazon grant Israel virtually government-wide access to their cloud and artificial intelligence technologies, enhancing data processing, decision-making and surveillance and analysis capacities."
  lang: en
status: contested
response: "Asked by +972 Magazine, AWS said it was \"focused on making the benefits of our world-leading cloud technology available to all our customers\". Israel called the report politically motivated and legally baseless."
