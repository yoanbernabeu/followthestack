subject: linkedin
grievances: [lgbtphobia]
date: "2025-07-28"
summary: "LinkedIn removed \"misgendering or deadnaming of transgender individuals\" from the examples of prohibited conduct in the Hateful and Derogatory Content section of its English-language Professional Community Policies, and removed \"race or gender identity\" from the examples in its harassment policy, without announcing the change. The edit was flagged by the nonprofit Open Terms Archive. GLAAD called it an \"overt anti-LGBTQ move\"."
quote:
  text: "misgendering or deadnaming of transgender individuals"
  lang: en
status: established
response: "LinkedIn said it regularly updates its policies and that \"personal attacks or intimidation toward anyone based on their identity, including misgendering\" still violate its harassment policy and are not allowed on the platform."
