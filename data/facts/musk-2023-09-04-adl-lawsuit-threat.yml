subject: elon-musk
grievances: [antisemitism]
date: "2023-09-04"
summary: "After liking a post by an Irish white supremacist calling for X to ban the Anti-Defamation League, after which the #BanTheADL hashtag trended, blamed the ADL for a 60% drop in X's advertising revenue and threatened to sue the Jewish civil rights group for defamation, estimating damages at \"roughly $22 billion\"."
quote:
  text: "trying to kill this platform by falsely accusing it & me of being anti-Semitic"
  lang: en
status: contested
response: "Musk wrote: \"I'm pro free speech, but against anti-Semitism of any kind.\""
