subject: tesla
grievances: [racism]
date: "2023-09-28"
summary: "The US Equal Employment Opportunity Commission sued Tesla, alleging that since at least May 2015 Black workers at its Fremont factory were routinely subjected to racial slurs, including \"monkey\", \"boy\" and the n-word, and to racist graffiti including swastikas, threats and nooses, and that workers who complained faced retaliation."
status: contested
response: "Tesla did not immediately comment; it has previously said it \"is absolutely against any form of discrimination, harassment or unfair treatment of any kind\"."
sources:
