subject: jd-vance
grievances: [anti-immigration, far-right-support]
date: "2025-02-14"
summary: "At the Munich Security Conference, a week before German federal elections, said nothing was more urgent than mass migration and that there was \"no room for firewalls\", the term for German parties' refusal to cooperate with the far-right AfD. Germany's defense minister called the speech unacceptable."
quote:
  text: "Of all the pressing challenges that the nations represented here face, I believe there is nothing more urgent than mass migration."
