subject: garry-tan
grievances: [violent-rhetoric]
date: "2024-01-01"
datePrecision: month
summary: "Posted on X in late January 2024 a message naming seven San Francisco supervisors that ended with \"Die slow motherfuckers\", then deleted it. Days later, five of the supervisors he named received mailed threats bearing his face and referencing his post; Supervisor Aaron Peskin said he did not believe the letter he received came from Tan."
quote:
  text: "Die slow motherfuckers."
  lang: en
status: established
response: "Tan deleted the post, said it was a reference to a Tupac Shakur song (\"I thought everyone would get the rap reference but that wasn't a good call, reference or not – sorry!\") and sent the board an apology saying \"there is no place, no excuse and no reason for this type of speech and charged language in discourse\"."
