grievances: [anti-democracy, far-right-support]
date: "2025-01-20"
summary: "On his first day back in office, signed a proclamation granting full pardons to people convicted of offenses related to the January 6, 2021 attack on the US Capitol (about 1,500 people, by his own count), commuting the sentences of 14 others to time served, including Oath Keepers founder Stewart Rhodes, and directing the dismissal of pending indictments. Former Proud Boys leader Enrique Tarrio, convicted of seditious conspiracy, was pardoned. The proclamation said it \"ends a grave national injustice that has been perpetrated upon the American people over the last four years\"."
