subject: sridhar-vembu
grievances: [far-right-support]
date: "2020-01-06"
summary: "As CEO of Zoho, accepted to be chief guest at \"Resurgent Bharath\", an event organised by the Rashtriya Swayamsevak Sangh (RSS) in Chennai on 2 February 2020. Al Jazeera describes the RSS as \"the ideological fountainhead of the Hindu far right\". Faced with criticism and calls to boycott Zoho, he refused to withdraw, while the Accenture executive listed as guest of honour said he had never agreed to attend. The reports do not confirm whether Vembu attended the event."
quote:
  text: "If you dislike which events I attend, please do what your conscience dictates and I will do what mine dictates."
