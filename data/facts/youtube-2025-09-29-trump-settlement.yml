date: "2025-09-29"
summary: "Agreed to pay $24.5 million to settle Donald Trump's 2021 lawsuit over the suspension of his account, of which $22 million is to be contributed on Trump's behalf to the Trust for the National Mall, the nonprofit overseeing the construction of a White House ballroom. Legal experts had predicted Trump had little chance of prevailing."
status: established
response: "The settlement filing states it \"does not constitute an admission of liability\". Google confirmed the settlement and declined further comment."
