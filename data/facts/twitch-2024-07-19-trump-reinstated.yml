subject: twitch
grievances: [far-right-support]
date: "2024-07-19"
summary: "Reinstated Donald Trump's Twitch channel during the 2024 presidential campaign. Twitch had indefinitely suspended the channel in January 2021, after the attack on the US Capitol, citing \"the ongoing risk of further incitement of violence\". The V-Dem Institute describes the Republican Party under Trump as endorsing \"a far-right, nationalist, and anti-pluralist agenda\"."
quote:
  text: "there is value in hearing from presidential nominees directly, when possible"
  lang: en
status: established
response: "Twitch told TechCrunch it reinstated the channel because there is value in hearing from presidential nominees directly, and that the channel remains subject to its community guidelines."
