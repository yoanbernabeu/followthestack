summary: "In an interview with Jordan Peterson released on 22 July 2024, referred to his transgender daughter Vivian Jenna Wilson by her former name, said he had been \"tricked\" into consenting to puberty blockers, described his child as dead, and said he had vowed to destroy the \"woke mind virus\"."
quote:
  text: "My son Xavier is dead, killed by the woke mind virus."
  lang: en
status: established
response: "Wilson told NBC News that Musk had not been tricked and knew what he was doing when he consented to her treatment: \"He was not by any means tricked.\""
