date: "2025-02-14"
summary: "Met AfD co-leader and chancellor candidate Alice Weidel at his hotel in Munich (for about 30 minutes, according to her spokesperson), nine days before the German federal election and on the day of his Munich Security Conference speech against \"firewalls\" excluding the far right. A German government spokesperson said it was wrong for foreigners to intervene so heavily in an election campaign."
status: established
response: "His office confirmed the meeting and said he met leaders of all of Germany's major parties."
