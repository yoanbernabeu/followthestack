subject: matt-mullenweg
grievances: [lgbtphobia]
date: "2024-02-22"
summary: "As CEO of Tumblr owner Automattic, publicly argued with a banned transgender Tumblr user over the moderation decision on Tumblr and other platforms and shared private details of her account, including private account names. The user had been banned after posting that she hoped Mullenweg \"dies a forever painful death\". The dispute drew community-wide outcry and accusations of transphobia."
status: contested
response: "Mullenweg said the user was banned for posts threatening violence against Tumblr staff, not for her transition photos, and that trans people on staff were not protesting the decision."
