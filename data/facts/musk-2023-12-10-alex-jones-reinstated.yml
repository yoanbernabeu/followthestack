subject: elon-musk
grievances: [far-right-support]
date: "2023-12-10"
summary: "Restored the X account of Infowars host Alex Jones, described by NBC News as a far-right radio host, banned from Twitter in 2018 for abusive behaviour, after a poll he posted showed about 70% of respondents in favour. Jones had repeatedly called the 2012 Sandy Hook school shooting a hoax, and relatives of victims had won nearly $1.5 billion in defamation judgments against him. In November 2022 Musk had said he would not reinstate Jones."
quote:
  text: "The people have spoken and so it shall be."
  lang: en
status: established
response: "Musk presented the move as a matter of free speech, writing that it was likely that Community Notes \"will respond rapidly to any AJ post that needs correction.\""
