subject: david-heinemeier-hansson
grievances: [lgbtphobia]
date: 2025-06-03
summary: "Blog post opposing Pride Week material on gender identity and the Gender and Sexuality Alliance meetings for primary pupils (grades 3-5) at the Copenhagen International School, calling the Pride Week activities \"overt indoctrination\" and the meetings \"outright creepy\". He reported that the school dropped the remaining Pride Week material for the semester after parent feedback."
quote:
  text: "There's simply no responsible explanation for having kids as young as eight, or even as old as 11, in lunch and recess meetings with CIS staff to discuss gender and sexuality on school campus."
