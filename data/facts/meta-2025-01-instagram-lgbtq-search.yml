subject: meta
grievances: [lgbtphobia]
date: "2025-01-06"
summary: "User Mag reported that Instagram had for months hidden search results for LGBTQ-related terms and hashtags such as #lesbian, #gay and #trans for teen accounts under its \"sensitive content\" filter. Meta lifted the restriction after being contacted."
status: contested
response: "Meta said: \"These search terms and hashtags were mistakenly restricted\" and that it does not consider LGBTQ+ terms to be sensitive under its policies."
