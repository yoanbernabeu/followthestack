subject: naspers
grievances: [racism]
date: "2015-07-25"
summary: "At Naspers's centenary celebration in Cape Town, Esmaré Weideman, CEO of its print arm Media24, acknowledged the group's complicity in apartheid and asked for forgiveness, citing Conrad Sidego, the first reporter of colour at its newspaper Die Burger, who was not allowed to use the company's bathroom. Naspers had not made a submission to the Truth and Reconciliation Commission's media hearings in the 1990s."
quote:
  text: "We acknowledge complicity in a morally indefensible political regime"
  lang: en
status: established
response: "The statement was itself the company's apology. Critics, including a piece first published by Quartz, called it late and incomplete."
