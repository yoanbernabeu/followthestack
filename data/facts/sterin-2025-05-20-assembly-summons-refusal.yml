subject: pierre-edouard-sterin
grievances: [anti-democracy]
date: "2025-05-20"
summary: "Failed for a second time to appear before a French National Assembly inquiry committee on the organisation of elections, which wanted to question him about the roughly €20 million a year he plans to spend through Périclès. The committee chair, Thomas Cazenave, said nothing justified Stérin placing himself \"au-dessus des lois de la République\"; refusing to appear before such a committee is punishable by up to two years in prison and a €7,500 fine."
status: established
response: "Stérin officially cited concerns for his safety; shortly before the hearing he criticised the deputies on CNews. He was questioned by the judicial police in November 2025 over the refusals, and appeared by videoconference before a Senate inquiry committee on 4 June 2026."
