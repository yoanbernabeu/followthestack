subject: mozilla-corporation
grievances: [authoritarian-alignment]
date: "2024-06-01"
datePrecision: month
summary: "Made several censorship-circumvention Firefox add-ons, including Censor Tracker, Runet Censorship Bypass and two VPN or proxy extensions, unavailable in Russia on its add-on store after persistent removal demands from Russia's censorship agency Roskomnadzor. Mozilla reversed the decision and reinstated the listings on 13 June 2024, the day after The Intercept reported the restrictions."
quote:
  text: "After careful consideration, we've temporarily restricted their availability within Russia."
  lang: en
status: established
response: "Announcing the reversal, Mozilla said: \"Our initial decision to temporarily restrict these listings was made while we considered the regulatory environment\" and the potential risk to its community and staff, and that it would reinstate them \"in alignment with our commitment to an open and accessible Internet\"."
