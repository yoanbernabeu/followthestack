summary: "After China's media regulator ordered ByteDance's joke-sharing app Neihan Duanzi permanently shut down, published an open letter of apology saying, in TechNode's translation, the app's content went against \"core socialist values\" and that the company had not done a thorough job \"guiding public opinion\", accepting the penalty and pledging to grow its content review team from 6,000 to 10,000 staff."
