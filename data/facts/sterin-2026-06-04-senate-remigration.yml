subject: pierre-edouard-sterin
grievances: [anti-immigration]
date: "2026-06-04"
summary: "Heard by videoconference by the French Senate inquiry committee on the private funding of public policy, said he supports the \"remigration\" of foreigners who are offenders, undocumented or unemployed for more than twelve months, describing himself as \"to the right of the far right\" on immigration. He also defended Périclès as a \"metapolitical\" project; the committee's rapporteur, Colombe Brossel, said the hearing had not answered questions on the transparency of his funding."
quote:
  text: "Je suis en faveur de la remigration des étrangers délinquants, sans papiers ou au chômage depuis plus de douze mois"
