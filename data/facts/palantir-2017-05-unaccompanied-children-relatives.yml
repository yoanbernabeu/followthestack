summary: "Homeland Security documents obtained through FOIA litigation showed that Palantir software was central to a 2017 ICE operation targeting the parents and relatives who sponsored unaccompanied migrant children. ICE told The Intercept the operation led to 443 arrests, including 35 criminal arrests."
status: established
response: "Palantir had previously stated: \"We do not work for E.R.O.\" (ICE's Enforcement and Removal Operations). Palantir did not immediately comment on the documents."
