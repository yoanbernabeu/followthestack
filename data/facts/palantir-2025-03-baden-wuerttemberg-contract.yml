subject: palantir
grievances: [surveillance-deportation]
date: "2025-03-01"
datePrecision: month
summary: "Signed a five-year contract worth about €24 million, reportedly without an exit clause, with the Baden-Württemberg interior ministry for police data analysis, before the state had a legal basis for automated police data analysis and, according to taz, apparently without the knowledge of the Green coalition partner. The enabling bill was only tabled in September 2025; bodies consulted on it, including the DGB union confederation, criticised the contract being signed before a legal basis existed."
status: established
response: "The state government says funds for the software were approved in the 2025/2026 budget in December 2024 and that a first draft of the enabling law already existed when the contract was signed."
