subject: bytedance
grievances: [authoritarian-alignment]
date: "2019-09-25"
summary: "Leaked TikTok moderation guidelines revealed by the Guardian instructed moderators to censor videos mentioning Tiananmen Square, Tibetan independence or the banned religious group Falun Gong, which the Guardian described as ByteDance advancing Chinese foreign policy aims abroad through the app."
status: established
response: "ByteDance said the version of the guidelines seen by the Guardian was retired in May 2019, that the old guidelines took \"a blunt approach\" and were outdated, and that current guidelines do not reference specific countries or issues."
sources:
  - url: https://www.theguardian.com/technology/2019/sep/25/revealed-how-tiktok-censors-videos-that-do-not-please-beijing
    outlet: "The Guardian"
    date: "2019-09-25"
