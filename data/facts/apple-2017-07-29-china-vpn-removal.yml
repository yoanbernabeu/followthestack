subject: apple
grievances: [authoritarian-alignment]
date: "2017-07-29"
summary: "Removed VPN apps used to bypass China's internet censorship, including ExpressVPN, from its App Store in China after the government required VPN providers to hold a state licence."
status: established
response: "Apple said: \"We have been required to remove some VPN apps in China that do not meet the new regulations. These apps remain available in all other markets where they do business.\""
