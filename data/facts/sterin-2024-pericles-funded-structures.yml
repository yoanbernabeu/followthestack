subject: pierre-edouard-sterin
grievances: [far-right-funding]
date: "2024-01-01"
datePrecision: year
summary: "Through his Périclès project, which he said would invest €20 million a year, supported at least 24 think tanks, associations, media outlets and training institutes in 2024, according to La Lettre as reported by Politis. Politis grouped several beneficiaries as \"islamophobes ou sécuritaires\" and listed LÉA, an association created to fight \"racisme anti-blanc\". On 28 May 2026, Périclès director Arnaud Rérolle told a Senate inquiry committee that Périclès had given three to four million euros to associations in each of 2025 and 2026, citing the Observatoire de l'immigration et de la démocratie among the beneficiaries."
status: established
response: "Arnaud Rérolle told senators that Périclès defends right-wing ideas \"peu représentées dans ce débat public\" by legal means and has never received public funding."
