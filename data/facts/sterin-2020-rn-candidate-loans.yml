subject: pierre-edouard-sterin
grievances: [far-right-funding]
date: "2020-01-01"
datePrecision: year
summary: "Was one of the private lenders, according to Le Monde and BFMTV, behind about €1.8 million in personal loans that financed Rassemblement National campaigns in the 2020 municipal elections in Marseille, Nice and Lyon and the 2021 regional elections in PACA, Normandy, Occitanie and Centre-Val de Loire; beneficiaries included Stéphane Ravier, Philippe Vardon and Thierry Mariani. A preliminary investigation by the Marseille prosecutor, stemming from facts that emerged in a procedure opened in Alençon on 18 January 2021 and later extended to money laundering and the illegal exercise of the banking profession, examines how the loans were granted; Stérin was questioned as a suspect on 11 June 2024 and has not been charged."
status: established
response: "Stérin confirmed he was questioned, said the loans were \"effectués à titre personnel\" and declared, and that he \"n'a jamais participé, directement ou indirectement, à un quelconque financement illégal de campagne\"."
