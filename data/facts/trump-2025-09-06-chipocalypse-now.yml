subject: donald-trump
grievances: [violent-rhetoric, anti-immigration]
date: "2025-09-06"
summary: "As his administration prepared immigration raids and a federal crackdown in Chicago, posted an AI-generated image of himself as an officer in the war film \"Apocalypse Now\", captioned \"Chipocalypse Now\", with a post saying Chicago would find out why it is called the Department of War, accompanied by helicopter emojis. Illinois Democrats condemned the post; Governor JB Pritzker said the president was threatening to go to war with an American city."
quote:
  text: "I love the smell of deportations in the morning"
  lang: en
status: established
response: "White House spokesperson Abigail Jackson said local Democratic leaders were \"more upset about a post from the President\" than about weekend shootings in Chicago."
