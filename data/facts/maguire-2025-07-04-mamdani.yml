summary: "Posted on X that New York mayoral candidate Zohran Mamdani \"comes from a culture that lies about everything\" and would lie \"if it advances his Islamist agenda\". An open letter signed by close to 600 people, including start-up founders, executives and investors, asked Sequoia Capital to condemn the comments and apologize."
