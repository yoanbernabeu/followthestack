subject: apple
grievances: [authoritarian-alignment]
date: "2021-10-15"
summary: "Removed Quran Majeed, one of the most popular Quran apps, from its App Store in China following a request from Chinese officials; the BBC understood it was removed for hosting illegal religious texts."
status: established
response: "Apple declined to comment and referred to its human rights policy, which states it is \"required to comply with local laws\"."
