subject: pierre-edouard-sterin
grievances: [racism]
date: "2025-06-11"
summary: "Speaking by videoconference at a conference titled \"Agir en chrétien pour le bien commun\" organised by the traditionalist Catholic Institut du Bon Pasteur, answered a question on his priorities for France by saying \"to have more babies of European stock\", and said he wanted these children to be baptised. The conference took place on 11 June 2025; the video was posted on YouTube on 23 July 2025 and reported by Mediapart, France 3 and Reporterre."
