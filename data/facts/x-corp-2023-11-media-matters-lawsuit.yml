subject: x-corp
grievances: [press-justice-attacks]
date: "2023-11-20"
summary: "Sued the media watchdog Media Matters for America in federal court in Texas over its research showing ads from major brands next to antisemitic and pro-Nazi content on X, after Musk promised a \"thermonuclear lawsuit\". X entities later filed similar suits against the group in Ireland and Singapore."
status: established
response: "Media Matters called it \"a frivolous lawsuit meant to bully X's critics into silence\" and said it stands behind its reporting. X says the group built misleading images that did not reflect a typical user's experience."
